name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pyflakes pytest
      - name: Tests
        run: |
          set -a
          . ./.env.example
          set +a
          python -m pytest -q
      - name: Pyflakes
        run: python -m pyflakes app/
